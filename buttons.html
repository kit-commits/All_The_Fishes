<script type="module">

//All of our Pixi code goes here

//Import Pixi
import {
    Application,
    Assets,
    Sprite,
    Container,
    Graphics,
    Text,
    TextStyle
} from './js/pixi.js';

//Create new app
const app = new Application();

//Initialize app
await app.init({ 
    background: 0x66CC66,
    width:640,
    height:480
});
document.body.appendChild(app.canvas);

//We're making a button
// let whatever = new Button("Name",200,60);
class Button extends Container {

    //Constructor
    constructor(l, w, h) {
        super(); //Set up the old object

        //Build the button
        this.l = l;
        this.w = w;
        this.h = h;
        this.c = 0xFFFFFF;

        //Make it listen for events
        this.eventMode = 'static';

        //Draw the button
        this.draw();

        //Set hover states
        this.on('mouseover',() => {
            this.alpha = .85;
            this.cursor = "pointer";
        });
        this.on('mouseout',() => {
            this.alpha = 1;
            this.cursor = "auto";
        });
    }
    //Actually set everything up
    draw() {
        //Empty it out
        while(this.children.length > 0)
            this.removeChildAt(0);

        //The body
        this.body = new Graphics()
                    .rect(0,0, this.w, this.h)
                    .fill(this.c);
        this.addChild(this.body);

        //The label
        this.label = new Text({
            text: this.l,
            anchor:.5
        });
        this.label.x = this.w/2;
        this.label.y = this.h/2;
        this.addChild(this.label);
    }

    // Add button to the application stage
    addToStage(stage) {
        stage.addChild(this);
    }

    // Make it listen to events
    // this.eventMode = 'static'; // This line is misplaced and should be removed

    //Set the label
    setLabel(name) {
        this.l = name;
        this.draw();
    }
    //Set color
    setColor(color) {
        this.c = color;
        this.draw();
    }

    // Make it listen to events
    // this.eventMode = 'static'; // This line is misplaced and should be removed

    // Add hover states
    // this.on('mouseover',() => {
    //     this.alpha = .85;
    //     this.cursor = "pointer";
    // });
    // this.on('mouseout',() => {
    //     this.alpha = 1;
    //     this.cursor = "auto";
    // });

    //Set size
    setSize(w,h) {
        this.w = w;
        this.h = h;
        this.draw();
    }

}

let button =  new Button("Boo!",200,60);
    button.x = 100;

// ========== Color Button ==========
const fishColorOptions = [0xFF0000, 0x00FF00, 0x0000FF, 0xFFFF00, 0xFF00FF];

const colorButton = new Button("Change Color", 150, 50);
colorButton.x = 50;
colorButton.y = 350;
app.stage.addChild(colorButton);

// Create a test fish for color changes
const testFish = new Container();
const testFishBody = new Graphics()
    .circle(0, 0, 25)
    .fill({ color: 0xFF0000 });
testFish.addChild(testFishBody);
testFish.x = 100;
testFish.y = 250;
app.stage.addChild(testFish);

colorButton.on('click', () => {
    const randomIndex = Math.floor(Math.random() * fishColorOptions.length);
    const newColor = fishColorOptions[randomIndex];
    testFish.children[0].clear().circle(0, 0, 25).fill({ color: newColor });
});

// ========== Draggable Fish ==========
const fish = new Container();
const fishBody = new Graphics()
    .ellipse(0, 0, 40, 25)
    .fill({ color: 0xFFA500 });
fish.addChild(fishBody);
fish.x = 300;
fish.y = 200;
fish.eventMode = 'dynamic';
app.stage.addChild(fish);

let isDragging = false;
let dragOffsetX = 0;
let dragOffsetY = 0;

fish.on('pointerdown', (event) => {
    isDragging = true;
    dragOffsetX = fish.x - event.global.x;
    dragOffsetY = fish.y - event.global.y;
});

app.stage.on('pointermove', (event) => {
    if (isDragging) {
        fish.x = event.global.x + dragOffsetX;
        fish.y = event.global.y + dragOffsetY;
    }
});

app.stage.on('pointerup', () => {
    isDragging = false;
});

// ========== Bonus Slider ==========
const sliderBg = new Graphics()
    .rect(0, 0, 200, 12)
    .fill({ color: 0xCCCCCC });
sliderBg.x = 50;
sliderBg.y = 450;
app.stage.addChild(sliderBg);

const sliderHandle = new Graphics()
    .circle(0, 0, 15)
    .fill({ color: 0x0000FF });
sliderHandle.x = 50;
sliderHandle.y = 456;
sliderHandle.eventMode = 'dynamic';
app.stage.addChild(sliderHandle);

let isSliderDragging = false;

sliderHandle.on('pointerdown', () => {
    isSliderDragging = true;
});

app.stage.on('pointermove', (event) => {
    if (isSliderDragging) {
        const newX = Math.max(50, Math.min(250, event.global.x));
        sliderHandle.x = newX;
        const percentage = (newX - 50) / 200;
        const scale = 0.5 + percentage * 1.5;
        fish.scale.set(scale);
    }
});

app.stage.on('pointerup', () => {
    isSliderDragging = false;
});

</script>
