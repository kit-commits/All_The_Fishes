<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All the Fishes</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                linear-gradient(to bottom, #5f6fd9 0%, #2f3f91 45%, #121a4a 100%);
            font-family: Georgia, serif;
        }

        canvas {
            max-width: min(92vw, 900px);
            height: auto;
            border-radius: 22px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        }
    </style>
</head>
<body>
<script type="module">

// Import the Pixi building blocks used in this scene.
import {
    Application,
    Assets,
    Sprite,
    Container,
    Graphics
} from './js/pixi.js';
import { Animate, sleep } from './js/animate.js';

// Create the Pixi application and its drawing surface.
const app = new Application();

// Configure the canvas size and rendering quality.
await app.init({
    background: 0x121a4a,
    width: 900,
    height: 560,
    antialias: true
});
document.body.appendChild(app.canvas);

// Load the shared fish image once, then build the whole aquarium scene.
const texture = await Assets.load('img/fish.png');
const aquarium = new Container();
app.stage.addChild(aquarium);

// Keep the tank measurements in one object so the rest of the code can reuse them.
const tank = {
    x: 60,
    y: 40,
    width: 780,
    height: 460,
    top: 54,
    bottom: 470,
    left: 76,
    right: 824
};

// Draw the tank frame behind everything else.
const frame = new Graphics()
    .roundRect(tank.x, tank.y, tank.width, tank.height, 26)
    .fill({ color: 0x2b387e, alpha: 0.56 });
aquarium.addChild(frame);

// Draw the water area inside the frame.
const water = new Graphics()
    .roundRect(
        tank.left,
        tank.top, 
        tank.right - tank.left, 
        tank.bottom - tank.top,
        {
            topLeft: 18,
            topRight: 18,
            bottomLeft: 18,
            bottomRight: 18
        }
    )
    .fill({ color: 0x4d63c9, alpha: 0.88 });
aquarium.addChild(water);

// Add a soft glow so the water feels deeper and less flat.
const depthGlow = new Graphics()
    .ellipse(app.screen.width / 2, 308, 300, 178).fill({ color: 0x8fb9ff, alpha: 0.09 })
    .ellipse(app.screen.width / 2, 304, 212, 126).fill({ color: 0x9fc6ff, alpha: 0.11 })
    .ellipse(app.screen.width / 2, 300, 128, 74).fill({ color: 0xb2d4ff, alpha: 0.13 })
    .ellipse(app.screen.width / 2, 296, 66, 42).fill({ color: 0xc7e2ff, alpha: 0.16 });
aquarium.addChildAt(depthGlow, 0);

// Build the gravel floor at the bottom of the tank.
const gravel = new Graphics()
    .rect(tank.left + 4, tank.bottom - 74, tank.right - tank.left - 8, 72)
    .fill({ color: 0xb1a9c5, alpha: 0.9 });
aquarium.addChild(gravel);

// Scatter small pebbles across the gravel with slight random variation.
const gravelDots = new Graphics();
const colors = [0xcdb9d6, 0xa695c2, 0x7d6a9f, 0xe7dff6];

// Create an array for each color group, then randomly assign each pebble to a color group.

const pebbleGroups = colors.map(() => []);

// Pre-generate the pebbles and assign them to color groups.

for (let index = 0; index < 180; index += 1) {
    const x = tank.left + 12 + Math.random() * (tank.right - tank.left - 24);
    const y = tank.bottom - 6 - Math.random() * 62;
    const size = 2 + Math.random() * 2.5;

    const colorIndex = index % colors.length;
    pebbleGroups[colorIndex].push({ x, y, size });
    gravelDots.circle(x, y, size).fill(colors[colorIndex]);
}

// Draw the pebbles in order of color so they do not overlap each other.
colors.forEach((color, index) => {
    pebbleGroups[index].forEach((pebble) => {
        gravelDots.circle(pebble.x, pebble.y, pebble.size).fill(color);
    });
    gravelDots.fill({ color, alpha: 0.92 });
});
aquarium.addChild(gravelDots);

// Build one plant from several leaf shapes, then place it in the tank.
function createPlant(baseX, baseY, scale, color) {
    const plant = new Container();

    for (let leaf = 0; leaf < 6; leaf += 1) {
        const stem = new Graphics()
            .roundRect(-6, -74, 10, 116, 8)
            .fill({ color, alpha: 0.92 });

        stem.pivot.set(0, 16);
        stem.x = leaf * 12;
        stem.y = leaf % 2 === 0 ? -7 : 7;
        stem.rotation = (-0.3 + leaf * 0.18);
        plant.addChild(stem);
    }

    plant.x = baseX;
    plant.y = baseY;
    plant.scale.set(scale);
    plant.alpha = 0.92;
    return plant;
}

// Create a few plants with different sizes and positions.
const plants = [
    createPlant(226, tank.bottom - 40, 1.20, 0x5f6fb7),
    createPlant(276, tank.bottom - 40, 0.72, 0x6d63aa),
    createPlant(676, tank.bottom - 42, 1.20, 0x4f79b4),
    createPlant(762, tank.bottom - 40, 0.88, 0x7b69b8)
];
plants.forEach((plant) => aquarium.addChild(plant));

// Add a rock and a small arch decoration to make the tank feel furnished.
const rock = new Graphics()
    .ellipse(395, tank.bottom - 12, 72, 30)
    .fill({ color: 0x8d7ca4, alpha: 0.88 });
aquarium.addChild(rock);

// Add another rock to the right side of the tank to balance the composition.
const rock2 = new Graphics()
    .ellipse(720, tank.bottom - 12, 64, 28)
    .fill({ color: 0x8d7ca4, alpha: 0.88 });
aquarium.addChild(rock2);

// Add a third rock to the left side of the tank to balance the composition.
const rock3 = new Graphics()
    .ellipse(160, tank.bottom - 12, 48, 20)
    .fill({ color: 0x8d7ca4, alpha: 0.88 });
aquarium.addChild(rock3);   

const arch = new Graphics()
    .roundRect(560, tank.bottom - 108, 80, 76, 22)
    .fill({ color: 0x7b739f, alpha: 0.9 });
arch.circle(600, tank.bottom - 66, 24).fill({ color: 0x4e66ba, alpha: 0.82 });
aquarium.addChild(arch);

const archLeft = new Graphics()
    .roundRect(120, tank.bottom - 108, 80, 76, 22)
    .fill({ color: 0x7b739f, alpha: 0.9 });
archLeft.circle(160, tank.bottom - 66, 24).fill({ color: 0x4e66ba, alpha: 0.82 });
aquarium.addChild(archLeft);

// Paint a transparent glass layer and a couple of reflection streaks on top.
const glass = new Graphics()
    .roundRect(tank.left, tank.top, tank.right - tank.left, tank.bottom - tank.top, 18)
    .fill({ color: 0xffffff, alpha: 0.09 });
glass.rect(tank.left + 24, tank.top + 18, 28, tank.bottom - tank.top - 84).fill({ color: 0xffffff, alpha: 0.11 });
glass.rect(tank.right - 74, tank.top + 50, 11, tank.bottom - tank.top - 150).fill({ color: 0xffffff, alpha: 0.07 });
aquarium.addChild(glass);

const shimmer = new Container();
const shimmerBands = new Graphics()
    .rect(118, 154, 660, 14).fill({ color: 0xd2e7ff, alpha: 0.045 })
    .rect(162, 238, 574, 12).fill({ color: 0xe2f0ff, alpha: 0.035 })
    .rect(214, 324, 510, 10).fill({ color: 0xf0f7ff, alpha: 0.03 });
const surfaceGlow = new Graphics()
    .ellipse(app.screen.width / 2, tank.top + 18, 290, 30)
    .fill({ color: 0xffffff, alpha: 0.08 });
shimmer.addChild(shimmerBands);
shimmer.addChild(surfaceGlow);
aquarium.addChild(shimmer);

async function animateTankPulse() {
    while (true) {
        await Promise.all([
            Animate.to(water, {
                duration: 1800,
                alpha: 0.94,
                tint: 0x5f7ade,
                easing: Animate.easeInOut
            }),
            Animate.to(glass, {
                duration: 1800,
                alpha: 0.13,
                easing: Animate.easeInOut
            }),
            Animate.to(depthGlow, {
                duration: 1800,
                scaleX: 1.03,
                scaleY: 1.03,
                alpha: 1,
                tint: 0x9ec5ff,
                easing: Animate.easeInOut
            }),
            Animate.to(shimmer, {
                duration: 1800,
                x: 7,
                y: -1,
                alpha: 0.97,
                rotation: 0.004,
                easing: Animate.easeInOut
            })
        ]);

        await Promise.all([
            Animate.to(water, {
                duration: 1800,
                alpha: 0.88,
                tint: 0x4d63c9,
                easing: Animate.easeInOut
            }),
            Animate.to(glass, {
                duration: 1800,
                alpha: 0.09,
                easing: Animate.easeInOut
            }),
            Animate.to(depthGlow, {
                duration: 1800,
                scaleX: 1,
                scaleY: 1,
                alpha: 0.92,
                tint: 0xffffff,
                easing: Animate.easeInOut
            }),
            Animate.to(shimmer, {
                duration: 1800,
                x: 0,
                y: 0,
                alpha: 1,
                rotation: 0,
                easing: Animate.easeInOut
            })
        ]);
    }
}

animateTankPulse();

// Create one fish container, attach its sprite, and store its motion settings.
function createFish(config) {
    const fish = new Container();
    const sprite = new Sprite(texture);

    sprite.anchor.set(0.18, 0.5);
    sprite.scale.set(config.scale * config.facing, config.scale);
    sprite.tint = config.tint;

    fish.addChild(sprite);
    fish.sprite = sprite;
    fish.baseX = config.x;
    fish.baseY = config.y;
    fish.range = config.range;
    fish.speed = config.speed;
    fish.phase = config.phase;
    fish.amplitude = config.amplitude;
    fish.baseScale = config.scale;

    fish.facing = config.facing;
    fish.mode = config.mode;

    fish.colorShift = Boolean(config.colorShift);

    fish.x = config.x;
    fish.y = config.y;
    return fish;
}

// Resize a fish while preserving the direction it is facing.
function setFishScale(fish, xScale, yScale) {
    fish.sprite.scale.set(Math.abs(xScale) * fish.facing, yScale);
}

function clampFishToTank(fish, padding = 0) {
    const bounds = fish.getBounds();

    if (bounds.x < tank.left + padding) {
        fish.x += (tank.left + padding) - bounds.x;
    }
    if (bounds.x + bounds.width > tank.right - padding) {
        fish.x -= (bounds.x + bounds.width) - (tank.right - padding);
    }
    if (bounds.y < tank.top + padding) {
        fish.y += (tank.top + padding) - bounds.y;
    }
    if (bounds.y + bounds.height > tank.bottom - padding) {
        fish.y -= (bounds.y + bounds.height) - (tank.bottom - padding);
    }
}

function clampContainerToTank(container, padding = 0) {
    const bounds = container.getBounds();

    if (bounds.x < tank.left + padding) {
        container.x += (tank.left + padding) - bounds.x;
    }
    if (bounds.x + bounds.width > tank.right - padding) {
        container.x -= (bounds.x + bounds.width) - (tank.right - padding);
    }
    if (bounds.y < tank.top + padding) {
        container.y += (tank.top + padding) - bounds.y;
    }
    if (bounds.y + bounds.height > tank.bottom - padding) {
        container.y -= (bounds.y + bounds.height) - (tank.bottom - padding);
    }
}

// Named constants make fish tuning easier than editing raw numbers inline.
const FISH_COLORS = {
    neeDohPurple: 0xAD7A8A,
    neeDohPink: 0xB9475E,
    purplePink: 0xB48A98,
    roseRed: 0xC25A70,
    schoolMauve: 0xcb7fd6,
    schoolPurpleRose: 0xb467cc,
    schoolPlumMauve: 0x934eb8
};

const SOLO_FISH_SETTINGS = {
    glider: { x: 220, y: 190, range: 60, speed: 0.0032, phase: 1.0, amplitude: 1.5, scale: 0.30, tint: FISH_COLORS.neeDohPurple, facing: 1, mode: 'loop', colorShift: true },
    scout: { x: 690, y: 155, range: 35, speed: 0.0038, phase: 2, amplitude: 2, scale: 0.26, tint: FISH_COLORS.neeDohPink, facing: -1, mode: 'pingpong', colorShift: true },
    drifter: { x: 610, y: 145, range: 16, speed: 0.0038, phase: 1.4, amplitude: 1.2, scale: 0.2, tint: 0xc4548a, facing: -1, mode: 'loop', colorShift: false }
};

// These are the individual fish that swim on their own.
const soloFish = [
    createFish(SOLO_FISH_SETTINGS.glider),
    createFish(SOLO_FISH_SETTINGS.scout),
    createFish(SOLO_FISH_SETTINGS.drifter)
];
const leaderFish = soloFish[0];
const tapFish = soloFish[1];
const surfaceFish = soloFish[2];
const fishScriptState = {
    surfaceFish: 'idle',
    tapFish: 'idle'
};
soloFish.forEach((fish) => aquarium.addChild(fish));

// The mouseTarget object is used to smoothly move the leader fish toward the mouse pointer.

const mouseTarget = {
    x: leaderFish.baseX,
    y: leaderFish.baseY
};

// Add the pointermove listener to update the mouseTarget coordinates whenever the mouse moves.
app.canvas.addEventListener('pointermove', (event) => {
    const rect = app.canvas.getBoundingClientRect();
    const scaleX = app.canvas.width / rect.width;
    const scaleY = app.canvas.height / rect.height;
    mouseTarget.x = (event.clientX - rect.left) * scaleX;
    mouseTarget.y = (event.clientY - rect.top) * scaleY;
});

// Clamp the coordinates of the mouseTarget so the leader fish does not swim outside the tank.
function clampMouseTarget() {
    mouseTarget.x = Math.max(tank.left + 20, Math.min(tank.right - 20, mouseTarget.x));
    mouseTarget.y = Math.max(tank.top + 20, Math.min(tank.bottom - 20, mouseTarget.y));
}

// don't move the fish simply by assigning the mouseTarget coordinates to the fish. Instead, move the fish gradually toward the target for a more natural swimming motion.

function updateLeaderFish() {
    clampMouseTarget();
    const dx = mouseTarget.x - leaderFish.baseX;
    const dy = mouseTarget.y - leaderFish.baseY;
    leaderFish.baseX += dx * 0.05;
    leaderFish.baseY += dy * 0.05;
}

function clampTankPoint(x, y, padding = 24) {
    return {
        x: Math.max(tank.left + padding, Math.min(tank.right - padding, x)),
        y: Math.max(tank.top + padding, Math.min(tank.bottom - padding, y))
    };
}

function faceFishTowardX(fish, targetX) {
    fish.facing = targetX >= fish.x ? 1 : -1;
}

async function runSurfaceFishSequence() {
    if (fishScriptState.surfaceFish !== 'idle')
        return;

    fishScriptState.surfaceFish = 'swim-up';
    faceFishTowardX(surfaceFish, surfaceFish.baseX);

    await Animate.to(surfaceFish, {
        duration: 900,
        x: surfaceFish.baseX,
        y: tank.top + 30,
        rotation: -0.16,
        easing: Animate.easeInOut
    });

    await sleep(250);

    fishScriptState.surfaceFish = 'swim-down';
    faceFishTowardX(surfaceFish, surfaceFish.baseX);

    await Animate.to(surfaceFish, {
        duration: 1100,
        x: surfaceFish.baseX,
        y: surfaceFish.baseY,
        rotation: 0,
        easing: Animate.easeInOut
    });

    fishScriptState.surfaceFish = 'idle';
}

async function runTapFishSequence(rawTargetX, rawTargetY) {
    if (fishScriptState.tapFish !== 'idle')
        return;

    const target = clampTankPoint(rawTargetX, rawTargetY);

    fishScriptState.tapFish = 'to-tap';
    faceFishTowardX(tapFish, target.x);

    await Animate.to(tapFish, {
        duration: 1200,
        x: target.x,
        y: target.y,
        rotation: -0.08,
        easing: Animate.easeInOut
    });

    await sleep(200);

    fishScriptState.tapFish = 'to-idle';
    faceFishTowardX(tapFish, tapFish.baseX);

    await Animate.to(tapFish, {
        duration: 1200,
        x: tapFish.baseX,
        y: tapFish.baseY,
        rotation: 0,
        easing: Animate.easeInOut
    });

    fishScriptState.tapFish = 'idle';
}

// Use a parent container for the school so several fish can move together.
const school = new Container();
school.x = 360;
school.y = 418;
aquarium.addChild(school);

const SCHOOL_FISH_SETTINGS = {
    front: { x: 0, y: 0, range: 0, speed: 0, phase: 0, amplitude: 0, scale: 0.18, tint: FISH_COLORS.schoolMauve, facing: 1, mode: 'school' },
    middle: { x: 58, y: -18, range: 0, speed: 0, phase: 0, amplitude: 0, scale: 0.17, tint: FISH_COLORS.schoolPurpleRose, facing: 1, mode: 'school' },
    rear: { x: 92, y: 14, range: 0, speed: 0, phase: 0, amplitude: 0, scale: 0.16, tint: FISH_COLORS.schoolPlumMauve, facing: 1, mode: 'school' }
};

// These fish move relative to the school container instead of the whole stage.
const schoolFish = [
    createFish(SCHOOL_FISH_SETTINGS.front),
    createFish(SCHOOL_FISH_SETTINGS.middle),
    createFish(SCHOOL_FISH_SETTINGS.rear)
];
schoolFish.forEach((fish) => school.addChild(fish));

// Create a reusable set of bubbles that will continuously rise and reset.
const bubbles = [];
for (let index = 0; index < 24; index += 1) {
    const bubble = new Graphics()
        .circle(0, 0, 8 + Math.random() * 12)
        .fill({ color: 0xD9C8F2, alpha: 0.65 });

    bubble.x = 260 + Math.random() * 420;
    bubble.y = tank.bottom - 90 - Math.random() * 260;
    bubble.speed = 0.15 + Math.random() * 0.15;
    bubble.drift = 10 + Math.random() * 20;
    bubble.phase = Math.random() * Math.PI * 2;
    bubble.startY = bubble.y;
    bubble.baseX = bubble.x;
    bubbles.push(bubble);
    aquarium.addChild(bubble);
}

// Turn elapsed time into a smooth, shifting tint color.
function cycleColor(time) {
    const red = 185 + Math.round(Math.sin(time * 0.0022) * 35);
    const green = 110 + Math.round(Math.sin(time * 0.0022 + 2.1) * 20);
    const blue = 210 + Math.round(Math.sin(time * 0.0022 + 4.2) * 30);
    return (red << 16) + (green << 8) + blue;
}

// ==================== BONUS FEATURES ====================
// Combine all fish into one array for easier access
const allFish = [...soloFish, ...schoolFish];

// Create a color-change button
const colorButtonBg = new Graphics()
    .roundRect(0, 0, 200, 70, 8)
    .fill({ color: 0x7b69b8, alpha: 0.95 });

const colorButtonText = new Graphics()
    .rect(0, 0, 140, 50)
    .fill({ color: 0xFFFFFF, alpha: 0 }); // Invisible fill for text area

const colorButton = new Container();
colorButton.addChild(colorButtonBg);
colorButton.x = 30;
colorButton.y = 270 - 40 - 10;
colorButton.eventMode = 'static';
colorButton.cursor = 'pointer';
aquarium.addChild(colorButton);

// Add hover effect to button
colorButton.on('mouseover', () => {
    colorButtonBg.alpha = 0.7;
});
colorButton.on('mouseout', () => {
    colorButtonBg.alpha = 0.95;
});

// Create available colors for random selection
const buttonColorOptions = [0x1E90FF, 0x00CED1, 0x20B2AA, 0x4169E1, 0x9370DB, 0x00BFFF, 0x3CB371];

// Button click handler: change a random fish's color
colorButton.on('pointertap', () => {
    if (allFish.length > 0) {
        const randomFish = allFish[Math.floor(Math.random() * allFish.length)];
        const newColor = buttonColorOptions[Math.floor(Math.random() * buttonColorOptions.length)];
        randomFish.sprite.tint = newColor;
    }
});

// ==================== DRAGGABLE FISH ====================
// Make the leader fish draggable
let isDraggingFish = false;
let dragOffsetX = 0;
let dragOffsetY = 0;

leaderFish.eventMode = 'dynamic';
leaderFish.cursor = 'grab';
surfaceFish.eventMode = 'static';
surfaceFish.cursor = 'pointer';

surfaceFish.on('pointertap', (event) => {
    event.stopPropagation();

    if (isDraggingFish || isDraggingSlider) {
        return;
    }

    runSurfaceFishSequence();
});

glass.eventMode = 'static';
glass.cursor = 'crosshair';
glass.on('pointertap', (event) => {
    if (isDraggingFish || isDraggingSlider) {
        return;
    }

    runTapFishSequence(event.global.x, event.global.y);
});

leaderFish.on('pointerdown', (event) => {
    isDraggingFish = true;
    const rect = app.canvas.getBoundingClientRect();
    const scaleX = app.canvas.width / rect.width;
    const scaleY = app.canvas.height / rect.height;
    const canvasX = (event.clientX - rect.left) * scaleX;
    const canvasY = (event.clientY - rect.top) * scaleY;

    // Add a factor that reduces the offset so the fish doesn't jump to the mouse position immediately
    const slowFactor = 0.6; 
    
    dragOffsetX = (leaderFish.x - canvasX) * slowFactor;
    dragOffsetY = (leaderFish.y - canvasY) * slowFactor;

    leaderFish.cursor = 'grabbing';
});

app.canvas.addEventListener('pointermove', (event) => {
    if (isDraggingFish) {
        const rect = app.canvas.getBoundingClientRect();
        const scaleX = app.canvas.width / rect.width;
        const scaleY = app.canvas.height / rect.height;
        const canvasX = (event.clientX - rect.left) * scaleX;
        const canvasY = (event.clientY - rect.top) * scaleY;
        leaderFish.x = canvasX + dragOffsetX;
        leaderFish.y = canvasY + dragOffsetY;
        clampFishToTank(leaderFish, 2);
    }
});

app.canvas.addEventListener('pointerup', () => {
    isDraggingFish = false;
    leaderFish.cursor = 'grab';
});

// Slider Setup
const sliderX = 20;
const sliderY = 350;
const sliderTrackWidth = 150;
const sliderTrackHeight = 8;

// Create the track
const sliderTrack = new Graphics()
    .rect(0, 0, sliderTrackWidth, sliderTrackHeight)
    .fill({ color: 0xCCCCCC, alpha: 0.8 });
sliderTrack.x = sliderX;
sliderTrack.y = sliderY;
aquarium.addChild(sliderTrack);

// Create the handle
const sliderHandle = new Graphics()
    .circle(0, 0, 20)
    .fill({ color: 0x1E90FF, alpha: 0.9 });
sliderHandle.x = sliderX + (sliderTrackWidth / 2);
sliderHandle.y = sliderY;
sliderHandle.eventMode = 'static';
sliderHandle.cursor = 'pointer';
aquarium.addChild(sliderHandle);

// Slider state
let isDraggingSlider = false;
let sliderValue = 0.5; // 0 to 1

// Handle events
sliderHandle.on('pointerdown', () => {
    isDraggingSlider = true;
});

app.canvas.addEventListener('pointermove', (event) => {
    if (isDraggingSlider) {
        const rect = app.canvas.getBoundingClientRect();
        const scaleX = app.canvas.width / rect.width;
        const canvasX = (event.clientX - rect.left) * scaleX;
        
        // Clamp to track bounds
        const minX = sliderX;
        const maxX = sliderX + sliderTrackWidth;
        const newX = Math.max(minX, Math.min(maxX, canvasX));
        
        sliderHandle.x = newX;
        sliderValue = (newX - sliderX) / sliderTrackWidth;
        
        // Apply effect: scale all fish based on slider
        allFish.forEach(fish => {
            fish.scale.x = 0.9 + (sliderValue * 0.2); // 0.5x to 2x
            fish.scale.y = 0.9 + (sliderValue * 0.2);
        });
    }
});

app.canvas.addEventListener('pointerup', () => {
    isDraggingSlider = false;
});

// The ticker runs every frame and updates positions, scale, rotation, and tint.
app.ticker.add((ticker) => {
    const time = ticker.lastTime;
    const delta = ticker.deltaTime;

    // Animate the solo fish one by one.
    soloFish.forEach((fish, index) => {
        // Skip normal animation if the fish is being dragged
        if (fish === leaderFish && isDraggingFish) {
            return;
        }

        if (fish === surfaceFish && fishScriptState.surfaceFish !== 'idle') {
            return;
        }

        if (fish === tapFish && fishScriptState.tapFish !== 'idle') {
            return;
        }

        const motion = time * fish.speed + fish.phase;
        const flap = Math.sin(time * 0.03 + index) * 0.016;
        const bob = Math.sin(motion * 2.4) * fish.amplitude;

        // Ping-pong fish reverse direction when their horizontal travel changes sign.
        if (fish.mode === 'pingpong') {

            if (fish === leaderFish) {
                updateLeaderFish();
            }
            
            const swing = Math.sin(motion);
            const heading = Math.cos(motion) >= 0 ? 1 : -1;
            fish.x = fish.baseX + swing * fish.range;
            fish.y = fish.baseY + bob;
            fish.facing = heading;
            fish.sprite.scale.set((fish.baseScale + flap) * heading, fish.baseScale - flap * 0.35);
        } else {
            fish.x = fish.baseX + Math.sin(motion) * fish.range;
            fish.y = fish.baseY + bob;
            setFishScale(fish, fish.baseScale + flap, fish.baseScale - flap * 0.35);
        }

        if (fish.colorShift) {
            fish.sprite.tint = cycleColor(time);
        }

        clampFishToTank(fish, 2);
    });

    // Move the whole school as a group through the tank.
    school.x = 450 + Math.sin(time * 0.0016) * 140;
    school.y = 350 + Math.sin(time * 0.0022) * 24;

    // Add small individual motion so the school fish do not look rigid.
    schoolFish.forEach((fish, index) => {
        const flap = Math.sin(time * 0.032 + index * 0.8) * 0.018;
        setFishScale(fish, fish.baseScale + flap, fish.baseScale - flap * 0.35);
        fish.y = (index - 1) * 15 + Math.sin(time * 0.012 + index * 0.9) * 2.2;
    });

    clampContainerToTank(school, 2);

    // Gently sway the plants to imitate underwater movement.
    plants.forEach((plant, index) => {
        plant.rotation = Math.sin(time * 0.010 + index * 0.8) * 0.032;
    });

    // Raise each bubble and recycle it to the bottom when it reaches the top.
    bubbles.forEach((bubble, index) => {
        bubble.y -= bubble.speed * delta;
        bubble.x = bubble.baseX + Math.sin(time * 0.012 + bubble.phase + index) * bubble.drift;

        if (bubble.y < tank.top + 24) {
            bubble.y = tank.bottom - 100 + Math.random() * 120;
            bubble.baseX = 260 + Math.random() * 420;
        }
    });
});

</script>
